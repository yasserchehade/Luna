services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - luna_documents:/app/storage/documents
      - luna_cabinet:/app/storage/cabinet
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - backend/.env.example
    volumes:
      - ./backend:/app
      - luna_documents:/app/storage/documents
      - luna_cabinet:/app/storage/cabinet
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    env_file:
      - frontend/.env.example
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  luna_documents:
  luna_cabinet:
