name: Pull request checks

on:
  pull_request:
    paths:
      - "desktop/**"
      - "supabase/functions/**"
      - "ops/litellm/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/full-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-core:
    name: Verify core on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: "desktop/src-tauri -> target"
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node --test ops/litellm/canary.test.mjs ops/litellm/byok-canary.test.mjs
      - name: Validate pinned LiteLLM deployment
        env:
          OPENAI_API_KEY: sk-ci-placeholder
          LITELLM_MASTER_KEY: sk-ci-master-placeholder
          LITELLM_DATABASE_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://llmproxy:ci-placeholder@database:5432/litellm
        run: docker compose -f ops/litellm/compose.yaml config --quiet
      - name: Prove rendered BYOK secret isolation
        env:
          OPENAI_API_KEY: sk-ci-placeholder
          LITELLM_MASTER_KEY: sk-ci-master-placeholder
          LITELLM_DATABASE_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://llmproxy:ci-placeholder@database:5432/litellm
        run: node --test ops/litellm/compose.test.mjs
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - run: pnpm --filter luna-desktop test
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: pnpm --filter luna-desktop typecheck

  verify-platform:
    name: Verify desktop build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: "desktop/src-tauri -> target"
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Verify local canary Windows PowerShell boundary
        if: runner.os == 'Windows'
        shell: powershell
        run: .\ops\litellm\run-local-canary.test.ps1
      - run: pnpm --filter luna-desktop tauri build --debug --no-bundle
