services:
  managed-public-ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./managed-public-ingress.Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    tmpfs:
      - /config
      - /data
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - ingress

  managed-admin-ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./managed-admin-ingress.Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    tmpfs:
      - /config
      - /data
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - ingress

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      managed-public-ingress:
        condition: service_started
      managed-admin-ingress:
        condition: service_started
    networks:
      - ingress

secrets:
  cloudflare_tunnel_token:
    file: ${LUNA_CLOUDFLARE_TUNNEL_TOKEN_FILE:?Inject a Cloudflare Tunnel token file from the operator secret store}
