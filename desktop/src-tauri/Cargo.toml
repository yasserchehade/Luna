[package]
name = "luna-desktop"
version = "0.1.0"
description = "Luna household administration desktop"
authors = ["Luna contributors"]
edition = "2021"

[lib]
name = "luna_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
age = "0.12"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2.2"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
getrandom = "0.3"
keyring = "4.1"
pdf-extract = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
